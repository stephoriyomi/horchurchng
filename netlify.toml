[build]
  command   = "pnpm run build"
  publish   = ".next"

[build.environment]
  NODE_VERSION            = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify Next.js plugin handles SSR, ISR, image optimisation, and
# App Router server components automatically.
[[plugins]]
  package = "@netlify/plugin-nextjs"
